<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title data-i18n="toolbar.title">Bar</title>
<script src="../i18n/core.js"></script><script src="../i18n/areas/app.js"></script><script src="../i18n/areas/common.js"></script><script src="i18n.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1220; color: #eee; font: 12px "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  #bar { display: flex; align-items: center; gap: 4px; height: 100%; padding: 0 6px; }
  .sp { flex: 1; }
  button { border: 1px solid #ffffff22; background: #2a2030; color: #cfc6d6; border-radius: 6px; padding: 3px 9px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { background: #3a2f44; }
  button.on { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.plain.on { background: #2f6fed; border-color: #6c9bff; }
  button.on.warn { background: #b45309; border-color: #f59e0b; }
  button.on.real { background: #b91c1c; border-color: #f87171; }
  .ic { padding: 3px 7px; min-width: 24px; }
  .pct { min-width: 44px; }
  .gear { padding: 3px 5px; background: transparent; border-color: transparent; }
  button.upd { background: #b45309; border-color: #f59e0b; color: #fff; animation: pulse 1s ease-in-out infinite; }
  button.pw-off { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.lives-idle { background: #2f6fed; border-color: #6c9bff; color: #fff; }
  button.lives-ok { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.lives-changed { background: #d9342b; border-color: #ff7a72; color: #fff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px #d9342b66; } }
  button.vote-ready { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.vote-login { background: #2f6fed; border-color: #6c9bff; color: #fff; }
  .tag { color: #a99bb8; font-weight: 700; margin-right: 2px; }
  .tag.vote-ok { color: #2fd160; }
</style>
</head>
<body>
<div id="bar"></div>
<script>
  const bar = document.getElementById('bar');
  const el = (tag, cls, text, title) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (title) e.title = title;
    return e;
  };

  function renderSlot(s) {
    bar.textContent = '';
    // liga/desliga da conta: desligada não usa CPU nem memória (o jogo é descarregado); o login fica salvo
    bar.append(el('span', 'tag', s.off ? t('toolbar.account.off', { id: s.id }) : (s.uptime == null ? t('toolbar.account', { id: s.id }) : t('toolbar.account.up', { id: s.id, min: s.uptime })),
      s.off ? t('toolbar.tip.off', { pos: s.pos + 1 }) : t('toolbar.tip.up', { pos: s.pos + 1, min: s.uptime })));
    const pw = s.off
      ? el('button', 'ic pw-off', t('toolbar.power.on'), t('toolbar.power.on.tip'))
      : el('button', 'ic', '⏻', t('toolbar.power.off.tip'));
    pw.onclick = () => tb.action('power');
    bar.append(pw);
    if (s.off) {
      bar.append(el('div', 'sp'));
      const foco = el('button', 'plain', t('toolbar.focus'), t('toolbar.focus.tip'));
      foco.onclick = () => tb.action('focus');
      bar.append(foco);
      return;
    }
    // Funcionalidades com `group` ficam juntas num botão em drop (menu nativo); as demais seguem como botões
    for (const g of [...new Set(s.features.filter((f) => f.group).map((f) => f.group))]) {
      const fs = s.features.filter((f) => f.group === g);
      const dica = fs.map((f) => `${f.label}: ${f.on ? t('toolbar.group.tip.on') : t('toolbar.group.tip.off')}`).join('\n');
      const b = el('button', fs.some((f) => f.on) ? 'on' : '', `${g} ▾`, dica);
      b.onclick = () => { const r = b.getBoundingClientRect(); tb.menu(g, { x: r.left, y: r.bottom }); };
      bar.append(b);
    }
    for (const f of s.features.filter((x) => !x.group)) {
      const warn = f.on && /^⚠/.test(f.badge);
      const cls = (f.on ? 'on' : '') + (warn ? ' warn' : '') + (f.on && f.badge === 'REAL' ? ' real' : '');
      const dica = [f.title, f.on ? t('toolbar.feature.on') : t('toolbar.feature.off'), f.hint].filter(Boolean).join('\n');
      const b = el('button', cls, f.on && f.badge ? `${f.label} · ${f.badge}` : f.label, dica);
      b.onclick = () => tb.toggle(f.id);
      bar.append(b);
      if (f.hasSettings) {
        const g = el('button', 'gear', '⚙', t('toolbar.feature.settings', { name: f.label }));
        g.onclick = () => tb.action('settings:' + f.id);
        bar.append(g);
      }
    }
    // Voto no TopIdle (🗳): verde = liberado; azul = precisa entrar no TopIdle; o resto mostra quanto falta
    if (s.vote) {
      const cls = s.vote.kind === 'ready' ? 'vote-ready' : s.vote.kind === 'login' ? 'vote-login' : '';
      const bv = el('button', cls, s.vote.label, s.vote.hint);
      bv.onclick = () => tb.action('vote');
      bar.append(bv);
    }
    bar.append(el('div', 'sp'));
    // zoom da página da conta, som e recarregar
    const ic = (text, title, name, cls = '') => { const b = el('button', 'plain ic ' + cls, text, title); b.onclick = () => tb.action(name); bar.append(b); };
    ic('−', t('toolbar.zoom.out'), 'zoomOut');
    ic(Math.round((s.zoom ?? 1) * 100) + '%', t('toolbar.zoom.reset'), 'zoomReset', 'pct');
    ic('+', t('toolbar.zoom.in'), 'zoomIn');
    ic(s.muted ? '🔇' : '🔊', s.muted ? t('toolbar.sound.off') : t('toolbar.sound.on'), 'mute', s.muted ? 'on warn' : '');
    ic('⟳', t('toolbar.reload'), 'reload');
    const foco = el('button', 'plain', t('toolbar.focus'), t('toolbar.focus.tip'));
    foco.onclick = () => tb.action('focus');
    bar.append(foco);
  }

  function renderApp(s) {
    bar.textContent = '';
    const a = s.accounts;
    if (a.version) bar.append(el('span', 'tag', 'v' + a.version, t('toolbar.version.tip')));
    // quem pode votar no TopIdle agora (ou quanto falta para o próximo voto)
    if (a.votes?.text) bar.append(el('span', 'tag' + (a.votes.ready?.length ? ' vote-ok' : ''), a.votes.text, t('toolbar.votes.tip')));
    bar.append(el('div', 'sp'));
    const mk = (text, title, name, on) => {
      const b = el('button', 'plain' + (on ? ' on' : ''), text, title);
      b.onclick = () => tb.action(name);
      bar.append(b);
    };
    // Versão nova no GitHub: laranja piscando; o clique abre a página do Release (de lá baixa-se o instalador)
    if (a.update && a.update.kind === 'available') {
      const dicaUpd = t('toolbar.update.tip', { latest: a.update.latest, current: a.update.current });
      const bu = el('button', 'plain upd', t('toolbar.update', { version: a.update.latest }), dicaUpd);
      bu.onclick = () => tb.action('update');
      bar.append(bu);
    }
    mk(t('toolbar.accounts', { count: a.count, max: a.max }), t('toolbar.accounts.tip', { max: a.max }), 'accounts');
    if (a.focused !== null) mk(t('toolbar.grid'), t('toolbar.grid.tip'), 'grid', true);
    mk(t('toolbar.settings'), t('toolbar.settings.tip'), 'settings');
    mk(t('toolbar.logs'), t('toolbar.logs.tip'), 'logs');
    // ULTRA: liga/desliga o modo ULTRA Economia do próprio jogo em todas as contas (Ctrl+U)
    mk(a.ultra ? t('toolbar.ultra.on') : t('toolbar.ultra'), a.ultra ? t('toolbar.ultra.tip.on') : t('toolbar.ultra.tip.off'), 'ultra', a.ultra);
    // Pontos: painel com o rodapé do chat de cada live (para resgatar à mão); o log e a config do resgate automático
    const pOpen = a.points?.open ?? null;
    mk(t('toolbar.points.twitch'), t('toolbar.points.twitch.tip'), 'pointsTwitch', pOpen === 'twitch');
    mk(t('toolbar.points.kick'), t('toolbar.points.kick.tip'), 'pointsKick', pOpen === 'kick');
    // Lives (menu: contas, entrar na Twitch/Kick, detalhes, registro, config): cinza = desligadas; verde = ligadas e em dia;
    // vermelho piscando = pede uma ação (resgate parado, falta entrar na Twitch/Kick)
    const lv = a.lives || { kind: 'none', text: '' };
    const label = { none: t('toolbar.lives'), idle: t('toolbar.lives'), ok: t('toolbar.lives.ok'), changed: t('toolbar.lives.changed') }[lv.kind] || t('toolbar.lives');
    const dica = [lv.text || t('toolbar.lives.off'), lv.detail].filter(Boolean).join('\n');
    const bl = el('button', 'plain lives-' + lv.kind, label, dica);
    bl.onclick = () => tb.action('lives');
    bar.append(bl);
    mk(t('toolbar.help'), t('toolbar.help.tip'), 'help');
  }

  const render = (s) => (s.kind === 'app' ? renderApp(s) : renderSlot(s));
  tb.onState(render);
  tb.get().then((s) => s && render(s));
</script>
</body>
</html>
