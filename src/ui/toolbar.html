<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1220; color: #eee; font: 12px "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  #bar { display: flex; align-items: center; gap: 4px; height: 100%; padding: 0 6px; }
  .sp { flex: 1; }
  .left { display: flex; align-items: center; gap: 4px; flex: 1 1 0; min-width: 0; overflow: hidden; }
  .left > * { flex: none; }
  .right { display: flex; align-items: center; gap: 4px; flex: none; }
  .unit { display: inline-flex; align-items: center; }
  button { border: 1px solid #ffffff22; background: #2a2030; color: #cfc6d6; border-radius: 6px; padding: 3px 9px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { background: #3a2f44; }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { background: #2a2030; }
  button.on { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.plain.on { background: #2f6fed; border-color: #6c9bff; }
  button.on.warn { background: #b45309; border-color: #f59e0b; }
  button.on.real { background: #b91c1c; border-color: #f87171; }
  .ic { padding: 3px 7px; min-width: 24px; }
  .pct { min-width: 44px; }
  .gear { padding: 3px 5px; background: transparent; border-color: transparent; }
  button.upd { background: #b45309; border-color: #f59e0b; color: #fff; animation: pulse 1s ease-in-out infinite; }
  button.pw-off { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.lives-idle { background: #2f6fed; border-color: #6c9bff; color: #fff; }
  button.lives-changed { background: #d9342b; border-color: #ff7a72; color: #fff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px #d9342b66; } }
  button.vote-ready { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.dc-ok { background: #1b8f3a; border-color: #2fd160; color: #fff; }
  button.dc-notag { background: #b45309; border-color: #f59e0b; color: #fff; }
  button.dc-out { background: #3b4fc4; border-color: #7b8cff; color: #fff; }
  .tag { color: #a99bb8; font-weight: 700; margin-right: 2px; }
  .tag.vote-ok { color: #2fd160; }
  .tag.nome { display: inline-block; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 0; }
  .tag.tempo { display: inline-block; width: 58px; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 400; }
  /* telas menores (quadrante estreito, ex.: grade de 4 em 1366 px ou menos): o tempo sai (continua na dica) e o nome encurta, para caber mais botões */
  @media (max-width: 720px) { .tag.tempo { display: none; } .tag.nome { width: 66px; margin-right: 2px; } }
</style>
</head>
<body>
<div id="bar"></div>
<script>
  const bar = document.getElementById('bar');
  const el = (tag, cls, text, title) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (title) e.title = title;
    return e;
  };

  // Rótulos do botão Lives (geral e de cada conta): o estado aparece na cor e no rótulo
  const LIVES_LABEL = { none: 'Lives', idle: 'Lives', ok: 'Lives', changed: '⚠ Lives' };

  // Barra de uma conta: o lado direito (zoom, som, recarregar e Foco) tem largura fixa; o esquerdo ocupa o que sobra e
  // ESCONDE, da direita para a esquerda, o que não couber (ver fit()).
  function renderSlot(s) {
    bar.textContent = '';
    const left = el('div', 'left');
    const right = el('div', 'right');
    bar.append(left, right);
    // liga/desliga da conta: desligada não usa CPU nem memória (o jogo é descarregado); o login fica salvo
    // Nome e tempo em larguras FIXAS (nome longo é cortado com …): os botões ficam alinhados de uma conta para a outra
    const dicaNome = s.off ? `${s.label} · posição ${s.pos + 1} na grade · desligada` : `${s.label} · posição ${s.pos + 1} na grade · rodando há ${s.uptime ?? 0} min`;
    left.append(el('span', 'tag nome', s.label, dicaNome), el('span', 'tag tempo', s.off ? 'desligada' : s.uptime == null ? '' : `· ${s.uptime} min`, dicaNome));
    const pw = s.off
      ? el('button', 'ic pw-off', '⏻ Ligar', 'Ligar esta conta (recarrega o jogo)')
      : el('button', 'ic', '⏻', 'Desligar esta conta (libera CPU e memória; o login continua salvo)');
    pw.onclick = () => tb.action('power');
    left.append(pw);
    // Foco: sempre visível, no fim do lado direito
    const foco = el('button', 'plain' + (s.focused ? ' on' : ''), 'Foco', s.focused ? 'Em foco: clique para voltar à grade' : 'Mostra só esta conta em tela cheia (de novo: volta à grade)');
    foco.onclick = () => tb.action('focus');
    // Em foco: < (esquerda) e > (direita) do Foco passam para a conta anterior/seguinte (desativados na primeira e na última posição)
    const nav = []; // [<, >]: o Foco fica no meio (< Foco >)
    if (s.focused) {
      const prev = el('button', 'plain ic', '<', s.pos > 0 ? 'Conta anterior' : 'Já é a primeira conta');
      prev.disabled = !(s.pos > 0);
      prev.onclick = () => tb.action('focusPrev');
      const next = el('button', 'plain ic', '>', s.pos < s.count - 1 ? 'Próxima conta' : 'Já é a última conta');
      next.disabled = !(s.pos < s.count - 1);
      next.onclick = () => tb.action('focusNext');
      nav.push(prev, next);
    }
    const withFoco = () => (nav.length ? [nav[0], foco, nav[1]] : [foco]);
    if (s.off) { right.append(...withFoco()); fit(); return; }
    // Lives desta conta (com os Pontos dentro do menu): cinza = desligadas nela; verde = ligadas e em dia; azul = falta
    // entrar na Twitch/Kick; vermelho piscando = resgate parado. O clique abre o menu SÓ desta conta.
    const lv = s.lives || { kind: 'none', text: '', detail: '' };
    const bl2 = el('button', lv.kind === 'none' ? '' : 'lives-' + lv.kind, LIVES_LABEL[lv.kind] || 'Lives', [lv.text, lv.detail].filter(Boolean).join('\n'));
    bl2.onclick = () => { const r = bl2.getBoundingClientRect(); tb.popup('lives', { x: r.left, y: r.bottom }); };
    const ul = el('span', 'unit');
    ul.append(bl2);
    left.append(ul);
    // Demais botões, na ordem de `order` (menor = mais à esquerda). Funcionalidades com `group` viram um botão em drop
    // (menu nativo); as demais seguem como botões. Cada item leva junto a sua engrenagem.
    const itens = [];
    for (const g of [...new Set(s.features.filter((f) => f.group).map((f) => f.group))]) {
      const fs = s.features.filter((f) => f.group === g);
      const dica = fs.map((f) => `${f.label}: ${f.on ? 'ligado' : 'desligado'}`).join('\n');
      const b = el('button', fs.some((f) => f.on) ? 'on' : '', `${g} ▾`, dica);
      b.onclick = () => { const r = b.getBoundingClientRect(); tb.menu(g, { x: r.left, y: r.bottom }); };
      itens.push({ order: Math.min(...fs.map((f) => f.order ?? 100)), nodes: [b] });
    }
    for (const f of s.features.filter((x) => !x.group)) {
      const warn = f.on && /^⚠/.test(f.badge);
      const cls = (f.on ? 'on' : '') + (warn ? ' warn' : '') + (f.on && f.badge === 'REAL' ? ' real' : '');
      const dica = [f.title, `${f.on ? 'Ligado' : 'Desligado'} nesta conta — clique para alternar`, f.hint].filter(Boolean).join('\n');
      const b = el('button', cls, f.on && f.badge ? `${f.label} · ${f.badge}` : f.label, dica);
      // botão que abre uma janela (sem liga/desliga): o clique só abre; o verde mostra o estado
      b.onclick = () => (f.hasOpen ? tb.action('open:' + f.id) : tb.toggle(f.id));
      const nodes = [b];
      if (f.hasSettings) {
        const g = el('button', 'gear', '⚙', `Configurar ${f.label}`);
        g.onclick = () => tb.action('settings:' + f.id);
        nodes.push(g);
      }
      itens.push({ order: f.order ?? 100, nodes });
    }
    itens.sort((a, b) => a.order - b.order); // estável: a mesma ordem de antes quando não há `order`
    for (const it of itens) { const u = el('span', 'unit'); u.append(...it.nodes); left.append(u); }
    // Voto no IdleHub (🗳), por último: verde = liberado; o resto (desconhecido ou aguardando) mostra quanto falta
    if (s.vote) {
      const cls = s.vote.kind === 'ready' ? 'vote-ready' : '';
      const bv = el('button', cls, s.vote.label.replace('Votou · ', ''), s.vote.hint);
      bv.onclick = () => tb.action('vote');
      const u = el('span', 'unit');
      u.append(bv);
      left.append(u);
    }
    // Discord da conta (💬): entra no servidor do jogo e confere a tag IDLE
    if (s.discord) {
      // quadrante estreito: só o ícone e o estado (✓ ok, ! falta a tag, ↪ entrar); o texto completo fica na dica
      const compacto = narrow() ? '💬' + ({ ok: ' ✓', notag: ' !', out: ' ↪' }[s.discord.kind] || '') : s.discord.label;
      const bd = el('button', 'dc-' + s.discord.kind, compacto, narrow() ? `${s.discord.label}
${s.discord.hint}` : s.discord.hint);
      bd.onclick = () => tb.action('discord');
      const u = el('span', 'unit');
      u.append(bd);
      left.append(u);
    }
    // lado direito, largura fixa: zoom da página da conta, som, recarregar e Foco
    const ic = (text, title, name, cls = '') => { const b = el('button', 'plain ic ' + cls, text, title); b.onclick = () => tb.action(name); right.append(b); };
    ic('−', 'Diminuir o zoom', 'zoomOut');
    ic(Math.round((s.zoom ?? 1) * 100) + '%', 'Zoom desta conta neste modo (clique para voltar ao padrão: 100% em foco, 60% na grade de 4)', 'zoomReset', 'pct');
    ic('+', 'Aumentar o zoom', 'zoomIn');
    ic(s.muted ? '🔇' : '🔊', s.muted ? 'Som desligado — clique para ligar' : 'Som ligado — clique para silenciar', 'mute', s.muted ? 'on warn' : '');
    ic('⟳', 'Recarregar esta conta', 'reload');
    right.append(...withFoco());
    fit();
  }

  // Esconde, da direita para a esquerda, os itens do lado esquerdo que invadiriam o lado direito
  function fit() {
    const left = document.querySelector('.left');
    if (!left) return;
    const kids = [...left.children];
    for (const k of kids) k.style.display = '';
    const max = left.clientWidth;
    let usado = 0;
    let esconder = false;
    for (const k of kids) {
      const w = k.offsetWidth;
      const gap = usado ? 4 : 0;
      if (esconder || usado + gap + w > max) { k.style.display = 'none'; esconder = true; } else usado += gap + w;
    }
  }
  window.addEventListener('resize', fit);

  // Ícone de divisão de tela (duas colunas), desenhado em SVG: o rótulo "Contas: N/M" saiu da barra
  const splitIcon = () => {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '14');
    svg.setAttribute('viewBox', '0 0 16 14');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.6');
    const r = document.createElementNS(ns, 'rect');
    for (const [k, v] of Object.entries({ x: 1, y: 1, width: 14, height: 12, rx: 2 })) r.setAttribute(k, v);
    const l = document.createElementNS(ns, 'path');
    l.setAttribute('d', 'M8 1v12');
    svg.append(r, l);
    return svg;
  };

  // Barra do app, limpa: ajuda (F1) à esquerda; à direita, divisão de tela, Cafézin, ULTRA, Lives (com Pontos) e, no fim, ⚙ Configurações.
  function renderApp(s) {
    bar.textContent = '';
    const a = s.accounts;
    const btn = (text, title, name, cls = '') => {
      const b = el('button', 'plain ' + cls, text, title);
      b.onclick = () => tb.action(name);
      return b;
    };
    bar.append(btn('?', 'Ajuda (F1): atalhos e ajuda', 'help', 'ic'));
    if (a.version) bar.append(el('span', 'tag', 'v' + a.version, 'Versão do app'));
    // quem pode votar no IdleHub agora (ou quanto falta para o próximo voto)
    if (a.votes?.text) bar.append(el('span', 'tag' + (a.votes.ready?.length ? ' vote-ok' : ''), a.votes.text, 'Voto no IdleHub: clique no 🗳 de cada conta'));
    bar.append(el('div', 'sp'));
    // Versão nova no GitHub: laranja piscando; o clique abre a página do Release (de lá baixa-se o instalador)
    if (a.update && a.update.kind === 'available') {
      const dicaUpd = [`Há uma versão nova (v${a.update.latest}); a sua é a v${a.update.current}.`, 'Clique para abrir a página da versão e baixar o instalador.'].join('\n');
      const bu = el('button', 'plain upd', 'Atualizar → v' + a.update.latest, dicaUpd);
      bu.onclick = () => tb.action('update');
      bar.append(bu);
    }
    if (a.focused !== null) bar.append(btn('Voltar à grade', 'Sai do foco e mostra todas as contas', 'grid', 'on'));
    const bs = btn('', `Divisão de tela: alterna entre 2 e ${a.max} contas (agora ${a.count})`, 'accounts', 'ic' + (a.count >= a.max ? ' on' : ''));
    bs.append(splitIcon());
    bar.append(bs);
    bar.append(btn('☕ Cafézin', 'Pague-me um cafézin: apoie o projeto com um PIX (opcional)', 'cafe'));
    // ULTRA: liga/desliga o modo ULTRA Economia do próprio jogo em todas as contas (Ctrl+U)
    bar.append(btn(a.ultra ? '⚡ ULTRA ligado' : '⚡ ULTRA', a.ultra ? 'Modo ULTRA do jogo ligado em todas as contas. Clique para desligar (Ctrl+U)' : 'Liga o modo ULTRA Economia do jogo em todas as contas (Ctrl+U)', 'ultra', a.ultra ? 'on' : ''));
    // Lives (geral), com o painel de Pontos dentro: o clique abre um menu (Configurar lives / Pontos). Sem cor de "ok": só o alerta de mudança e o ocioso.
    const lv = a.lives || { kind: 'none', text: '' };
    const dica = [lv.text || 'Lives desligadas.', lv.detail, 'Clique para abrir o menu: configurar as lives e os pontos de Twitch e Kick.'].filter(Boolean).join('\n');
    const bl = el('button', 'plain lives-' + lv.kind, (LIVES_LABEL[lv.kind] || 'Lives') + ' ▾', dica);
    bl.onclick = () => { const r = bl.getBoundingClientRect(); tb.popup('lives', { x: r.left, y: r.bottom }); };
    bar.append(bl);
    bar.append(btn('⚙', 'Configurações: animações, vigia de captura, resgate de pontos, logs e licença', 'settings', 'ic'));
  }

  // quadrante estreito (grade de 4 em tela pequena): alguns botões ficam compactos; ao cruzar o limite, desenha de novo
  const NARROW_PX = 720;
  const narrow = () => window.innerWidth <= NARROW_PX;
  let ultimo = null;
  let eraEstreito = narrow();
  const render = (s) => { ultimo = s; return s.kind === 'app' ? renderApp(s) : renderSlot(s); };
  window.addEventListener('resize', () => { if (narrow() !== eraEstreito) { eraEstreito = narrow(); if (ultimo) render(ultimo); } });
  tb.onState(render);
  tb.get().then((s) => s && render(s));
</script>
</body>
</html>
