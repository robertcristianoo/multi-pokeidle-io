<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="../i18n/core.js"></script>
<script src="../i18n/areas/lives.js"></script>
<script src="../i18n/areas/common.js"></script>
<script src="i18n.js"></script>
<title data-i18n="lives.points.title">Pontos</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1220; color: #eee; font: 12px "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  #grip { height: 6px; cursor: ns-resize; background: #2f6fed; opacity: .6; }
  #grip:hover { opacity: 1; }
  #bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; }
  #title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #title small { color: #a99bb8; font-weight: 400; margin-left: 6px; }
  .sp { flex: 1; }
  button { border: 1px solid #ffffff22; background: #2a2030; color: #cfc6d6; border-radius: 6px; padding: 3px 9px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { background: #3a2f44; }
  button.on { background: #2f6fed; border-color: #6c9bff; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #notice { color: #f5c46b; padding: 0 8px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #notice:empty { display: none; }
</style>
</head>
<body>
<div id="grip" title="Arraste para mudar a altura do painel" data-i18n-title="lives.points.grip"></div>
<div id="bar">
  <div id="title" data-i18n="lives.points.title">Pontos</div>
  <span class="sp"></span>
  <button id="login" title="Entra na Twitch/Kick nesta conta" data-i18n-title="lives.points.loginTitle" data-i18n="lives.points.login">Entrar</button>
  <button id="logout" title="Sai da Twitch/Kick nesta conta" data-i18n-title="lives.points.logoutTitle" data-i18n="lives.points.logout">Sair</button>
  <button id="next" title="Próxima live desta conta (com a live no ar)" data-i18n-title="lives.points.nextTitle" data-i18n="lives.points.next">Próxima live ▶</button>
  <button id="full" class="" title="Mostra só o rodapé do chat (botão dos pontos) ou a página inteira" data-i18n-title="lives.points.fullTitle" data-i18n="lives.points.full">Página completa</button>
  <button id="config" title="Configuração do resgate automático das lives" data-i18n-title="lives.points.configTitle" data-i18n="lives.points.config">Config…</button>
  <button id="log" title="Registro dos resgates" data-i18n-title="lives.points.logTitle" data-i18n="lives.points.log">Registro</button>
  <button id="close" title="Fecha o painel e libera as páginas da memória" data-i18n-title="lives.points.closeTitle" data-i18n="lives.points.close">Fechar ✕</button>
</div>
<div id="notice"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const grip = $('grip');
  let dragging = false;
  grip.addEventListener('pointerdown', (e) => { dragging = true; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove', (e) => { if (dragging && e.movementY) pts.resize(e.movementY); });
  const stopDrag = () => { dragging = false; };
  grip.addEventListener('pointerup', stopDrag);
  grip.addEventListener('pointercancel', stopDrag);

  $('login').onclick = () => pts.cmd('login');
  $('logout').onclick = () => pts.cmd('logout');
  $('next').onclick = () => pts.cmd('next');
  $('full').onclick = () => pts.cmd('full');
  $('config').onclick = () => pts.cmd('config');
  $('log').onclick = () => pts.cmd('log');
  $('close').onclick = () => pts.cmd('close');

  pts.onState((s) => {
    const head = $('title');
    // account name is always in the title: the panel belongs to a single account
    head.textContent = t('lives.points.heading', { site: s.label, account: s.account });
    head.title = head.textContent;
    if (s.live) {
      const sm = document.createElement('small');
      sm.textContent = s.live;
      head.append(sm);
    }
    $('next').disabled = s.total < 2;
    $('full').textContent = s.full ? t('lives.points.footer') : t('lives.points.full');
    $('full').classList.toggle('on', !!s.full);
    const avisos = [s.stopped ? t('lives.points.stopped', { why: s.stopped }) : '', s.notice, s.text && !s.stopped ? s.text : ''].filter(Boolean);
    $('notice').textContent = avisos.join('  ·  ');
    $('notice').title = avisos.join('\n');
  });
</script>
</body>
</html>
