<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lives</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 13px "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: flex-end; }
  button { max-width: 100%; border: 1px solid #0006; border-radius: 18px; padding: 8px 14px; font: inherit; font-weight: 600; color: #fff; background: #2f6fed; cursor: pointer; box-shadow: 0 2px 10px #0008; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.ok { background: #1b8f3a; }
  button.changed { background: #d9342b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px #d9342b55, 0 2px 10px #0008; } }
</style>
</head>
<body>
<button id="b" hidden></button>
<script>
  const b = document.getElementById('b');
  b.onclick = () => window.lives.open();
  window.lives.onState((s) => {
    b.hidden = s.kind === 'none';
    b.className = s.kind;
    b.textContent = s.text;
    b.title = s.detail || '';
  });
</script>
</body>
</html>
